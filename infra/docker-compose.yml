# Local development only. The credentials below are throwaway values for a
# container that is reachable from this machine only (127.0.0.1).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: marec
      POSTGRES_PASSWORD: marec_local_dev_only
      POSTGRES_DB: marec
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - marec_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marec -d marec"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../services/api
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://marec:marec_local_dev_only@db:5432/marec
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET first. Make one with: python -c "import secrets; print(secrets.token_urlsafe(48))"}
      # Address that upload and download links point at. In Codespaces use the forwarded address
      # of port 8000, and make that port Public so the launcher on your PC can reach it.
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
    volumes:
      - ../services/api:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  marec_db:
